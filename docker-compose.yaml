x-app-env: &app-env
    DB_USERNAME: postgres
    DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
    CLUSTER_API_KEY: ${CLUSTER_API_KEY}
    CLUSTER_API_SECRET: ${CLUSTER_API_SECRET}
    JWT_ISSUER_URI: http://localhost:8080/realms/ecom-realm
    SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/ecom-realm/protocol/openid-connect/certs
    OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318/v1/traces
    CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
    CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
    CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
    JAVA_TOOL_OPTIONS: -Xmx256m -XX:+UseSerialGC -XX:TieredStopAtLevel=1
    MANAGEMENT_TRACING_SAMPLING_PROBABILITY: ${TRACING_SAMPLING_PROBABILITY:-0.0}

services:
    postgres:
        image: postgres:17.10-alpine
        container_name: ecom-postgres
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
            POSTGRES_DB: postgres
        ports:
            - "5433:5432"
        volumes:
            - postgres_data:/var/lib/postgresql/data
            - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
        healthcheck:
            test: [ "CMD", "pg_isready", "-U", "postgres" ]
            interval: 5s
            timeout: 3s
            retries: 10

    keycloak:
        image: quay.io/keycloak/keycloak:26.8.0
        container_name: ecom-keycloak
        command: start-dev --import-realm
        environment:
            KC_BOOTSTRAP_ADMIN_USERNAME: admin
            KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
            KC_DB: postgres
            KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
            KC_DB_USERNAME: postgres
            KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
            JAVA_OPTS_KC_HEAP: -Xms64m -Xmx512m
        ports:
            - "8080:8080"
        depends_on:
            postgres:
                condition: service_healthy
        volumes:
            - ./docker/keycloak:/opt/keycloak/data/import

#   switched to free tier confluentinc cloud kafka

    jaeger:
        image: jaegertracing/jaeger:2.10.0
        container_name: ecom-jaeger
        profiles: [ tracing ]
        ports:
            - "16686:16686"
            - "4318:4318"

    redis:
        image: redis:8.10.2-alpine
        container_name: ecom-redis
        command: [ "redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "volatile-lru" ]
        ports:
            - "6380:6379"

    customer-service:
        build:
            context: .
            dockerfile: docker/Dockerfile
            args:
                SERVICE: customer-service
        container_name: ecom-customer
        profiles: [ customer, all ]
        environment:
            <<: *app-env
            DB_URL: jdbc:postgresql://postgres:5432/customer_db
        ports:
            - "8081:8081"
        depends_on:
            postgres:
                condition: service_healthy

    catalog-service:
        build:
            context: .
            dockerfile: docker/Dockerfile
            args:
                SERVICE: catalog-service
        container_name: ecom-catalog
        profiles: [ catalog, shop, all ]
        environment:
            <<: *app-env
            DB_URL: jdbc:postgresql://postgres:5432/catalog_db
        ports:
            - "8082:8082"
        depends_on:
            postgres:
                condition: service_healthy

    inventory-service:
        build:
            context: .
            dockerfile: docker/Dockerfile
            args:
                SERVICE: inventory-service
        container_name: ecom-inventory
        profiles: [ inventory, shop, all ]
        environment:
            <<: *app-env
            DB_URL: jdbc:postgresql://postgres:5432/inventory_db
        ports:
            - "8083:8083"
        depends_on:
            postgres:
                condition: service_healthy

    order-service:
        build:
            context: .
            dockerfile: docker/Dockerfile
            args:
                SERVICE: order-service
        container_name: ecom-order
        profiles: [ order, shop, all ]
        environment:
            <<: *app-env
            DB_URL: jdbc:postgresql://postgres:5432/order_db
            REDIS_HOST: redis
            REDIS_PORT: 6379
            CATALOG_URL: http://catalog-service:8082
        ports:
            - "8084:8084"
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_started

    integration-service:
        build:
            context: .
            dockerfile: docker/Dockerfile
            args:
                SERVICE: integration-service
        container_name: ecom-integration
        profiles: [ integration, shop, all ]
        environment:
            <<: *app-env
            DB_URL: jdbc:postgresql://postgres:5432/integration_db
        ports:
            - "8086:8086"
        depends_on:
            postgres:
                condition: service_healthy

    proxy:
        image: nginx:1.27.5-alpine
        container_name: ecom-proxy
        profiles: [ proxy, all ]
        ports:
            - "8000:80"
        volumes:
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

    frontend:
        build:
            context: frontend
        container_name: ecom-frontend
        profiles: [ proxy, all ]

    swagger-ui:
        image: swaggerapi/swagger-ui:v5.17.14
        container_name: ecom-swagger
        profiles: [ proxy, all ]
        environment:
            BASE_URL: /swagger
            URLS: >-
                [{"name":"customer","url":"/docs/customer"},{"name":"catalog","url":"/docs/catalog"},
                {"name":"inventory","url":"/docs/inventory"},{"name":"order","url":"/docs/order"},
                {"name":"integration","url":"/docs/integration"},{"name":"search","url":"/docs/search"}]

    search-service:
        build:
            context: .
            dockerfile: docker/Dockerfile
            args:
                SERVICE: search-service
        container_name: ecom-search
        profiles: [ search, shop, all ]
        environment:
            <<: *app-env
            DB_URL: jdbc:postgresql://postgres:5432/search_db
        ports:
            - "8085:8085"
        depends_on:
            postgres:
                condition: service_healthy

volumes:
    postgres_data: