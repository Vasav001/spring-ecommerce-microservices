spring:
    application:
        name: customer-service

    datasource:
        url: jdbc:postgresql://localhost:5433/customer_db
        username: postgres
        password: postgres
        driver-class-name: org.postgresql.Driver

    jpa:
        hibernate:
            ddl-auto: validate
        show-sql: true
        properties:
            hibernate:
                format_sql: true

    flyway:
        enabled: true
        locations:
            - classpath:db/migration
        baseline-on-migrate: true
        validate-on-migrate: true

    security:
        oauth2:
            resourceserver:
                jwt:
                    issuer-uri: http://localhost:8080/realms/ecom-realm

    main:
        lazy-initialization: true

management:
    endpoints:
        web:
            exposure:
                include: "*"