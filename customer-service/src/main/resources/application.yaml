spring:
    application:
        name: customer-service

    datasource:
        url: ${DB_URL:jdbc:postgresql://localhost:5433/customer_db}
        username: ${DB_USERNAME:postgres}
        password: ${DB_PASSWORD:postgres}
        driver-class-name: org.postgresql.Driver

    jpa:
        open-in-view: false
        hibernate:
            ddl-auto: validate

    flyway:
        enabled: true
        locations:
            - classpath:db/migration
        validate-on-migrate: true

    security:
        oauth2:
            resourceserver:
                jwt:
                    issuer-uri: ${JWT_ISSUER_URI:http://localhost:8080/realms/ecom-realm}

customer:
    max-addresses: 10

server:
    port: 8081

management:
    endpoints:
        web:
            exposure:
                include: health,info
    tracing:
        sampling:
            probability: 1.0
    otlp:
        metrics:
            export:
                enabled: false
    opentelemetry:
        tracing:
            export:
                otlp:
                    endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
