spring:
    application:
        name: catalog-service

    datasource:
        url: ${DB_URL:jdbc:postgresql://localhost:5433/catalog_db}
        username: ${DB_USERNAME:postgres}
        password: ${DB_PASSWORD:postgres}
        driver-class-name: org.postgresql.Driver

    jpa:
        open-in-view: false
        hibernate:
            ddl-auto: validate

    flyway:
        enabled: true
        locations:
            - classpath:db/migration
        validate-on-migrate: true

    security:
        oauth2:
            resourceserver:
                jwt:
                    issuer-uri: ${JWT_ISSUER_URI:http://localhost:8080/realms/ecom-realm}

    kafka:
        bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
        client-id: ${spring.application.name}
        properties:
            security:
                protocol: SASL_SSL
            sasl:
                mechanism: PLAIN
                jaas:
                    config: org.apache.kafka.common.security.plain.PlainLoginModule required username='${CLUSTER_API_KEY}' password='${CLUSTER_API_SECRET}';
        producer:
            key-serializer: org.apache.kafka.common.serialization.StringSerializer
            value-serializer: org.apache.kafka.common.serialization.StringSerializer
            acks: all
            batch-size: 32KB
            compression-type: lz4
            properties:
                enable.idempotence: true
                max.in.flight.requests.per.connection: 5
                delivery.timeout.ms: 30000
                request.timeout.ms: 10000
                max.block.ms: 5000
                linger.ms: 5
        consumer:
            #            group-id: catalog-service-group
            key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
            value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
            enable-auto-commit: false
            auto-offset-reset: earliest
            max-poll-records: 50
            properties:
                max.poll.interval.ms: 300000
                partition.assignment.strategy: org.apache.kafka.clients.consumer.CooperativeStickyAssignor
        listener:
            ack-mode: record
            concurrency: 3
        admin:
            auto-create: true
            fail-fast: false
            modify-topic-configs: true

app:
    #    kafka:
    #        partitions: 6
    #        replicas: 1
    outbox:
        poll-ms: 2000
        batch-size: 3
    storage:
        provider: cloudinary
        cloudinary:
            cloud-name: ${CLOUDINARY_CLOUD_NAME}
            api-key: ${CLOUDINARY_API_KEY}
            api-secret: ${CLOUDINARY_API_SECRET}
    images:
        max-per-product: 10
        max-bytes: 5242880
        base-urls:
            cloudinary: https://res.cloudinary.com/${CLOUDINARY_CLOUD_NAME}/image/upload

server:
    port: 8082

management:
    endpoints:
        web:
            exposure:
                include: health,info
