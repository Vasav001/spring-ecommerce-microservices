spring:
    application:
        name: search-service

    datasource:
        url: ${DB_URL:jdbc:postgresql://localhost:5433/search_db}
        username: ${DB_USERNAME:postgres}
        password: ${DB_PASSWORD:postgres}
        driver-class-name: org.postgresql.Driver

    jpa:
        open-in-view: false
        hibernate:
            ddl-auto: validate

    flyway:
        enabled: true
        locations:
            - classpath:db/migration
        validate-on-migrate: true

    data:
        web:
            pageable:
                max-page-size: 100

    security:
        oauth2:
            resourceserver:
                jwt:
                    issuer-uri: ${JWT_ISSUER_URI:http://localhost:8080/realms/ecom-realm}

    kafka:
        bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
        client-id: ${spring.application.name}
        properties:
            security:
                protocol: SASL_SSL
            sasl:
                mechanism: PLAIN
                jaas:
                    config: org.apache.kafka.common.security.plain.PlainLoginModule required username='${CLUSTER_API_KEY}' password='${CLUSTER_API_SECRET}';
        admin:
            auto-create: false
        producer:
            key-serializer: org.apache.kafka.common.serialization.StringSerializer
            value-serializer: org.apache.kafka.common.serialization.StringSerializer
            acks: all
            batch-size: 32KB
            compression-type: lz4
            properties:
                enable.idempotence: true
                max.in.flight.requests.per.connection: 5
                delivery.timeout.ms: 30000
                request.timeout.ms: 10000
                max.block.ms: 5000
                linger.ms: 5
        consumer:
            key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
            value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
            enable-auto-commit: false
            auto-offset-reset: earliest
            max-poll-records: 50
            properties:
                max.poll.interval.ms: 300000
                partition.assignment.strategy: org.apache.kafka.clients.consumer.CooperativeStickyAssignor
        template:
            observation-enabled: true
        listener:
            ack-mode: record
            concurrency: 3
            observation-enabled: true

outbox:
    poll-interval: 2s
    batch-size: 50

springdoc:
    api-docs:
        path: /docs/search

server:
    forward-headers-strategy: framework
    port: 8085

management:
    endpoints:
        web:
            exposure:
                include: health,info
    tracing:
        sampling:
            probability: 1.0
    otlp:
        metrics:
            export:
                enabled: false
    opentelemetry:
        tracing:
            export:
                otlp:
                    endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}