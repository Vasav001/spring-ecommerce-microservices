server {
    listen 80;
    resolver 127.0.0.11 valid=10s ipv6=off;

    set $customer http://customer-service:8081;
    set $catalog http://catalog-service:8082;
    set $inventory http://inventory-service:8083;
    set $order http://order-service:8084;
    set $search http://search-service:8085;
    set $integration http://integration-service:8086;
    set $swagger http://swagger-ui:8080;
    set $frontend http://frontend:80;
    set $keycloak http://keycloak:8080;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    location ~ ^/(api/v1/customers|docs/customer)(/|$) {
        proxy_pass $customer;
    }

    location ~ ^/(api/v1/products|api/v1/reviews|api/v1/admin/products|docs/catalog)(/|$) {
        proxy_pass $catalog;
    }

    location ~ ^/(api/v1/inventory|api/v1/admin/inventory|docs/inventory)(/|$) {
        proxy_pass $inventory;
    }

    location ~ ^/(api/v1/cart|api/v1/checkout|api/v1/orders|api/v1/admin/orders|docs/order)(/|$) {
        proxy_pass $order;
    }

    location ~ ^/(api/v1/search|docs/search)(/|$) {
        proxy_pass $search;
    }

    location ~ ^/(api/v1/payments|api/v1/shipments|api/v1/uploads|api/v1/admin/shipments|api/v1/admin/uploads|docs/integration)(/|$) {
        proxy_pass $integration;
    }

    location /auth/ {
        proxy_pass $keycloak;
    }

    location / {
        proxy_pass $frontend;
    }

    location /swagger {
        proxy_pass $swagger;
    }
}
