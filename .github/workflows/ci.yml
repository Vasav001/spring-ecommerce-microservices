name: CI

on:
    push:
    pull_request:

permissions:
    contents: read
    id-token: write

env:
    PROJECT_ID: ecom-511712
    REGION: asia-south1
    CLUSTER: vasav-cluster-1
    ZONE: asia-south1-a
    DOMAIN: 34-8-188-125.sslip.io
    IMAGE_REPO: asia-south1-docker.pkg.dev/ecom-511712/ecom
    WIF_PROVIDER: projects/48646665334/locations/global/workloadIdentityPools/github/providers/github
    DEPLOY_SA: github-deploy@ecom-511712.iam.gserviceaccount.com
    RELEASE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

jobs:
    build:
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                include:
                    -   service: catalog-service
                        db: catalog_db
                    -   service: customer-service
                        db: customer_db
                    -   service: inventory-service
                        db: inventory_db
                    -   service: order-service
                        db: order_db
                    -   service: integration-service
                        db: integration_db
                    -   service: search-service
                        db: search_db
        services:
            postgres:
                image: postgres:17.10-alpine
                env:
                    POSTGRES_USER: postgres
                    POSTGRES_PASSWORD: postgres
                    POSTGRES_DB: ${{ matrix.db }}
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U postgres"
                    --health-interval 5s
                    --health-timeout 3s
                    --health-retries 10
        env:
            DB_URL: jdbc:postgresql://localhost:5432/${{ matrix.db }}
            KAFKA_BOOTSTRAP_SERVERS: localhost:9092
            CLUSTER_API_KEY: ci
            CLUSTER_API_SECRET: ci
        steps:
            -   uses: actions/checkout@v4
            -   uses: actions/setup-java@v4
                with:
                    distribution: temurin
                    java-version: 21
                    cache: maven
            -   run: mvn -B -f outbox-lib/pom.xml install -DskipTests
            -   run: mvn -B -f ${{ matrix.service }}/pom.xml verify

    frontend:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: frontend
        steps:
            -   uses: actions/checkout@v4
            -   uses: actions/setup-node@v4
                with:
                    node-version: 22
                    cache: npm
                    cache-dependency-path: frontend/package-lock.json
            -   run: npm ci
            -   run: npm run lint
            -   run: npm run build

    frontend-docker:
        needs: frontend
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            -   uses: actions/checkout@v4
            -   uses: docker/setup-buildx-action@v3
            -   if: env.RELEASE == 'true'
                id: gcp
                uses: google-github-actions/auth@v2
                with:
                    workload_identity_provider: ${{ env.WIF_PROVIDER }}
                    service_account: ${{ env.DEPLOY_SA }}
                    token_format: access_token
            -   if: env.RELEASE == 'true'
                uses: docker/login-action@v3
                with:
                    registry: ${{ env.REGION }}-docker.pkg.dev
                    username: oauth2accesstoken
                    password: ${{ steps.gcp.outputs.access_token }}
            -   uses: docker/build-push-action@v6
                with:
                    context: frontend
                    build-args: VITE_KEYCLOAK_URL=https://${{ env.DOMAIN }}/auth/realms/ecom-realm
                    tags: ${{ env.IMAGE_REPO }}/frontend:${{ github.sha }}
                    push: ${{ env.RELEASE == 'true' }}
                    cache-from: type=gha,scope=frontend
                    cache-to: type=gha,mode=max,scope=frontend

    docker:
        needs: build
        runs-on: ubuntu-latest
        timeout-minutes: 20
        strategy:
            fail-fast: false
            matrix:
                service: [ catalog-service, customer-service, inventory-service, order-service, integration-service, search-service ]
        steps:
            -   uses: actions/checkout@v4
            -   uses: docker/setup-buildx-action@v3
            -   if: env.RELEASE == 'true'
                id: gcp
                uses: google-github-actions/auth@v2
                with:
                    workload_identity_provider: ${{ env.WIF_PROVIDER }}
                    service_account: ${{ env.DEPLOY_SA }}
                    token_format: access_token
            -   if: env.RELEASE == 'true'
                uses: docker/login-action@v3
                with:
                    registry: ${{ env.REGION }}-docker.pkg.dev
                    username: oauth2accesstoken
                    password: ${{ steps.gcp.outputs.access_token }}
            -   uses: docker/build-push-action@v6
                with:
                    context: .
                    file: docker/Dockerfile
                    build-args: SERVICE=${{ matrix.service }}
                    tags: ${{ env.IMAGE_REPO }}/${{ matrix.service }}:${{ github.sha }}
                    push: ${{ env.RELEASE == 'true' }}
                    cache-from: type=gha,scope=${{ matrix.service }}
                    cache-to: type=gha,mode=max,scope=${{ matrix.service }}

    deploy:
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        needs: [ docker, frontend-docker ]
        runs-on: ubuntu-latest
        timeout-minutes: 30
        concurrency: deploy
        steps:
            -   uses: actions/checkout@v4
            -   uses: google-github-actions/auth@v2
                with:
                    workload_identity_provider: ${{ env.WIF_PROVIDER }}
                    service_account: ${{ env.DEPLOY_SA }}
            -   uses: google-github-actions/get-gke-credentials@v2
                with:
                    cluster_name: ${{ env.CLUSTER }}
                    location: ${{ env.ZONE }}
            -   run: echo "$SECRETS_ENV" > k8s/secrets.env
                env:
                    SECRETS_ENV: ${{ secrets.SECRETS_ENV }}
            -   run: bash k8s/deploy.sh
                env:
                    TAG: ${{ github.sha }}
            -   run: for d in $(kubectl -n ecom get deploy -o name); do kubectl -n ecom rollout status "$d" --timeout=15m; done
