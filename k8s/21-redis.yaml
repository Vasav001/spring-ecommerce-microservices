apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: ecom
spec:
  selector:
    app: redis
  ports:
    - port: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: ecom
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:8.10.2-alpine
          args: [ "redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "64mb", "--maxmemory-policy", "volatile-lru" ]
          ports:
            - containerPort: 6379
          resources:
            requests:
              memory: 32Mi
              cpu: 20m
            limits:
              memory: 96Mi
